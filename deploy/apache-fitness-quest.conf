# Apache site for Fitness Quest.
# Full guide: docs/DEPLOY.md
# Install:  sudo cp deploy/apache-fitness-quest.conf /etc/apache2/sites-available/fitness-quest.conf
#           sudo a2enmod proxy_fcgi setenvif headers && sudo a2ensite fitness-quest && sudo systemctl reload apache2
# HTTPS:    sudo certbot --apache -d fitness-quest.entity-forge.dev
#
# /api/* and /up go to Laravel (PHP-FPM); everything else is the Expo web build.

<VirtualHost *:80>
    ServerName fitness-quest.entity-forge.dev

    DocumentRoot /var/www/fitness-quest/app/dist

    <Directory /var/www/fitness-quest/app/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # App routes such as /progress are handled by the web app itself.
        FallbackResource /index.html
    </Directory>

    # Laravel API. Only index.php is ever executed.
    ProxyPassMatch "^/(api/.*|up)$" "unix:/run/php/php8.3-fpm.sock|fcgi://localhost/var/www/fitness-quest/api/public/index.php"
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # Hashed bundles never change; cache them for a year.
    <LocationMatch "^/_expo/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/fitness-quest-error.log
    CustomLog ${APACHE_LOG_DIR}/fitness-quest-access.log combined
</VirtualHost>
